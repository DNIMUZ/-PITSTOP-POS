[project]
name = "pitstop-pos-backend"
version = "1.0.0"
description = "PITSTOP POS - production-style POS backend (FastAPI + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pyjwt>=2.8,<3.0",
    "bcrypt>=4.1,<5.0",
    "slowapi>=0.1.9,<1.0",
    "orjson>=3.10,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "email-validator>=2.1,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Single event loop for the whole session so the shared async engine
# (asyncpg pool) is never reused across different loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Depends() in argument defaults is the standard FastAPI dependency idiom.
"app/routers/*.py" = ["B008"]
# Test data/assert lines are intentionally long.
"tests/*.py" = ["E501"]
